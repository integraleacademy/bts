<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contrats BTS</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/faviconcontrats.png') }}">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <h1>Intégrale Academy – Contrats</h1>
    <nav>
      {% if session.get('is_admin') %}
        <a href="{{ url_for('admin') }}">Gestion contrats BTS</a>
        <a href="{{ url_for('logout') }}">Déconnexion</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>© 2025 Intégrale Academy</p>
  </footer>
  {% if session.get('is_admin') %}
  <script>
    (() => {
      const storageKey = `admin-scroll-position:${window.location.pathname}${window.location.search}`;

      // Conserver la position avant chaque navigation ou envoi de formulaire.
      // Ainsi, après une modification, le retour à la liste ne replace pas
      // l'utilisateur en haut de la page.
      const saveScrollPosition = () => {
        sessionStorage.setItem(storageKey, JSON.stringify({
          x: window.scrollX,
          y: window.scrollY,
        }));
      };

      window.addEventListener('pagehide', saveScrollPosition);

      const savedPosition = sessionStorage.getItem(storageKey);
      if (!savedPosition) return;

      try {
        const { x, y } = JSON.parse(savedPosition);
        requestAnimationFrame(() => window.scrollTo(x, y));
      } catch (error) {
        sessionStorage.removeItem(storageKey);
      }
    })();
  </script>
  {% endif %}
</body>
</html>
