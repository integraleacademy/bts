{% extends 'base.html' %}
{% block content %}
<h2>Modifier un contrat</h2>
<form method="post" class="card">
  <label>Nom*<input name="nom" value="{{row.nom}}" required></label>
  <label>Prénom*<input name="prenom" value="{{row.prenom}}" required></label>
  
  <!-- Ajout du champ email apprenti -->
  <label>Email apprenti*<input type="email" name="mail" value="{{row.mail}}" required></label>
  
  <label>BTS*
    <select name="bts" required>
      {% for opt in ["BTS MOS","BTS CI","BTS PI","BTS MCO","BTS NDRC"] %}
        <option value="{{opt}}" {% if row.bts == opt %}selected{% endif %}>{{opt}}</option>
      {% endfor %}
    </select>
  </label>
  <label>Entreprise*<input name="entreprise" value="{{row.entreprise}}" required></label>
  <label>SIRET*<input name="siret" value="{{row.siret}}" required></label>
  <label>Caisse de retraite complémentaire*<input name="caisse_retraite" value="{{row.caisse_retraite or ''}}" required></label>
  <label>OPCO de rattachement de l'entreprise*<input name="opco" value="{{row.opco or ''}}" required></label>
  <label>Numéro de convention collective*<input name="numero_convention_collective" value="{{row.numero_convention_collective or ''}}" required></label>
  <label>Nom responsable*<input name="resp_nom" value="{{row.resp_nom}}" required></label>
  <label>Email responsable*<input type="email" name="resp_mail" value="{{row.resp_mail}}" required></label>
  <label>Téléphone responsable<input name="resp_tel" value="{{row.resp_tel}}"></label>
  <fieldset>
    <legend>Maître d'apprentissage</legend>
    <label>Nom*<input name="maitre_nom" value="{{row.maitre_nom or ''}}" required></label>
    <label>Prénom*<input name="maitre_prenom" value="{{row.maitre_prenom or ''}}" required></label>
    <label>Email*<input type="email" name="maitre_mail" value="{{row.maitre_mail or ''}}" required></label>
    <label>Date de naissance*<input type="date" name="maitre_date_naissance" value="{{row.maitre_date_naissance or ''}}" required></label>
    <label>Emploi occupé*<input name="maitre_emploi" value="{{row.maitre_emploi or ''}}" required></label>
    <label>Diplôme le plus élevé obtenu*<input name="maitre_diplome" value="{{row.maitre_diplome or ''}}" required></label>
  </fieldset>
  <label>Date début contrat*<input type="date" name="date_debut" value="{{row.date_debut}}" required></label>
  <label>Statut
    <select name="status">
      {% for s in statuses %}
        <option value="{{s}}" {% if row.status == s %}selected{% endif %}>{{s}}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit" class="btn">💾 Enregistrer</button>
  <a href="{{ url_for('admin') }}" class="btn">⬅️ Retour</a>
</form>
{% endblock %}
